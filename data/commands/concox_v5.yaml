device_type: "Concox V5"
commands:
  - id: status
    order: 1
    command: "STATUS#"
    purpose: "Check GPS, GSM, battery and server connection state"
    how_to_send: "Send this SMS from the registered number, or use the approved platform command box, then attach a screenshot of the full reply."
    output_schema:
      gps_fix: {type: string}
      gsm_signal: {type: integer}
      battery_voltage: {type: number}
      gprs_connected: {type: boolean}
      satellites: {type: integer}
    analysis:
      expected_description: "GPS fixed, GSM >= 3, GPRS connected, battery above 3.7V"
      llm_hint: "Explain findings in plain language; never infer a missing field."
      rules:
        - field: gps_fix
          condition: "== invalid"
          finding: "GPS has no valid fix"
          advice: "Move the vehicle to an open area with a clear view of the sky, then retry. If GPS remains invalid, ask an authorised technician to inspect the antenna and installation."
        - field: gps_fix
          condition: "== no"
          finding: "GPS has no fix"
          advice: "Move the vehicle to an open area with a clear view of the sky, then retry. If GPS remains invalid, ask an authorised technician to inspect the antenna and installation."
        - field: satellites
          condition: "< 3"
          finding: "Low satellite count"
          advice: "Move the vehicle to an open area with a clear view of the sky and allow time for the tracker to acquire satellites."
        - field: gsm_signal
          condition: "< 2"
          finding: "Weak GSM signal"
          advice: "Move the vehicle to an area with stronger mobile coverage. If the signal stays low, ask support to check the SIM/network."
        - field: gprs_connected
          condition: "== false"
          finding: "Device is not connected to the server"
          advice: "The device may not be sending data over mobile internet. Ask the support team to verify SIM data/APN settings before changing configuration."
        - field: battery_voltage
          condition: "< 3.7"
          finding: "Device supply/battery voltage is low"
          advice: "Have an authorised technician inspect the device power supply and wiring."
    next_if_inconclusive: [param]
  - id: param
    order: 2
    command: "PARAM#"
    purpose: "Check configured communication and server parameters"
    how_to_send: "Send this SMS from the registered number, or use the approved platform command box, then attach a screenshot of the full reply."
    output_schema:
      apn: {type: string}
      server: {type: string}
      port: {type: integer}
    analysis:
      expected_description: "APN/server parameters match the approved device configuration"
      llm_hint: "Do not make configuration changes based on a guess; mismatches require support review."
      rules: []
    next_if_inconclusive: []
